name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Inject API key
        run: |
          sed -i "s/ISI_API_KEY_KAMU/${{ secrets.GEMINI_KEY }}/" app/src/main/java/rkr/simplekeyboard/inputmethod/latin/AiClient.java
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: simple-keyboard-ai
          path: app/build/outputs/apk/debug/*.apk
